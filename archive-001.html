<nav>

<script>
  document.getElementById('year').textContent = new Date().getFullYear();
  // 'archive-001' is the collection slug — create it once in the admin
  // panel (or directly in Supabase) with this exact slug.
  fetchPublishedProducts({ collectionSlug: 'archive-001' })
    .then(products => renderProductGrid(products, document.getElementById('grid')));
</script>
